<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ghi chú theo từng ngày trong tuần.">
  <meta name="theme-color" content="#e9eef3">
  <title>Ghi chú trong tuần</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <h1>Ghi chú trong tuần</h1>
    <div class="clock">
      <div id="clock-time" class="clock-time">--:--:--</div>
      <div id="clock-date" class="clock-date"></div>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden>
    <span>Không tải được ghi chú.</span>
    <button type="button" id="retry" class="btn btn-save">Thử lại</button>
  </div>

  <main id="week" class="week" aria-label="Ghi chú theo ngày">
    <noscript><p class="banner">Trang này cần bật JavaScript.</p></noscript>
  </main>
</body>
</html>
